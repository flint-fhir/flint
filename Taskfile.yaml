# Flint Development Taskfile
# Usage: task dev      — create k3d cluster + deploy all services
#        task test     — run all tests (needs Postgres)
#        task down     — tear down k3d cluster
#        task status   — show running pods

version: '3'

vars:
  CLUSTER_NAME: flint-dev
  NAMESPACE: flint
  PG_DSN: "postgres://flint:flint@localhost:5432/flint?sslmode=disable"

tasks:
  dev:
    desc: Create k3d cluster and deploy all services
    cmds:
      - task: cluster-create
      - task: deploy-postgres
      - task: deploy-temporal
      - task: deploy-garage
      - task: deploy-iceberg
      - task: deploy-automq
      - echo "✅ Flint dev environment ready"
      - echo "  Postgres      → localhost:5432"
      - echo "  Temporal      → localhost:7233"
      - echo "  Temporal UI   → http://localhost:8088"
      - echo "  AutoMQ        → localhost:9092"
      - echo "  Garage (S3)   → http://localhost:9000"
      - echo "  Iceberg REST  → http://localhost:8181"

  cluster-create:
    desc: Create k3d cluster (idempotent)
    cmds:
      - k3d cluster list | grep -q {{.CLUSTER_NAME}} || k3d cluster create --config deploy/k3d/cluster.yaml
    status:
      - k3d cluster list | grep -q {{.CLUSTER_NAME}}

  deploy-postgres:
    desc: Deploy Postgres with schema migration
    cmds:
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create configmap postgres-init -n {{.NAMESPACE}}
          --from-file=001_core_schema.sql=store/postgres/migrations/001_core_schema.sql
          --from-file=002_resource_history.sql=store/postgres/migrations/002_resource_history.sql
          --from-file=003_audit_event.sql=store/postgres/migrations/003_audit_event.sql
          --from-file=004_oauth_and_export_jobs.sql=store/postgres/migrations/004_oauth_and_export_jobs.sql
          --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f deploy/k8s/postgres.yaml
      - echo "Waiting for Postgres..."
      - kubectl wait --for=condition=ready pod -l app=postgres -n {{.NAMESPACE}} --timeout=120s

  deploy-temporal:
    desc: Deploy Temporal with auto-setup
    cmds:
      - kubectl apply -f deploy/k8s/temporal.yaml
      - echo "Waiting for Temporal (this takes ~60s)..."
      - kubectl wait --for=condition=ready pod -l app=temporal -n {{.NAMESPACE}} --timeout=180s

  deploy-garage:
    desc: Deploy Garage S3-compatible object storage
    cmds:
      - kubectl apply -f deploy/k8s/garage.yaml
      - echo "Waiting for Garage..."
      - kubectl wait --for=condition=ready pod -l app=garage -n {{.NAMESPACE}} --timeout=120s

  deploy-iceberg:
    desc: Deploy Iceberg REST catalog
    cmds:
      - kubectl apply -f deploy/k8s/iceberg-rest.yaml
      - echo "Waiting for Iceberg REST catalog..."
      - kubectl wait --for=condition=ready pod -l app=iceberg-rest -n {{.NAMESPACE}} --timeout=120s

  deploy-automq:
    desc: Deploy AutoMQ with Table Topic → Iceberg
    cmds:
      - kubectl apply -f deploy/k8s/automq.yaml
      - echo "Waiting for AutoMQ..."
      - kubectl wait --for=condition=ready pod -l app=automq -n {{.NAMESPACE}} --timeout=120s

  test:
    desc: Run all Go tests (Postgres integration tests need FLINT_TEST_POSTGRES_DSN)
    cmds:
      - FLINT_TEST_POSTGRES_DSN="{{.PG_DSN}}" go test -race ./... -v -count=1

  test-analytics:
    desc: Run SQLMesh lakehouse dimensional model unit tests on DuckDB
    cmds:
      - uv run --project analytics sqlmesh --paths analytics test

  test-unit:
    desc: Run unit tests only (no Postgres needed)
    cmds:
      - go test ./ingest/workflow/ -v -count=1

  build:
    desc: Build flintd server, worker, seed, certify, and loadtest binaries
    cmds:
      - go build -o bin/flintd ./cmd/flintd/
      - go build -o bin/worker ./cmd/worker/
      - go build -o bin/seed ./cmd/seed/
      - go build -o bin/certify ./cmd/certify/
      - go build -o bin/loadtest ./cmd/loadtest/

  seed:
    desc: Seed a realistic 25-resource US Core v6.1.0 & v7.0.0 longitudinal clinical cohort into Flint (tenant=demo)
    cmds:
      - go run ./cmd/seed {{.CLI_ARGS}}

  certify:
    desc: Run automated 31-check FHIR R4, US Core v6.1.0 & v7.0.0, and ONC (g)(10) conformance certification suite
    cmds:
      - go run ./cmd/certify {{.CLI_ARGS}}

  certify-inferno:
    desc: Launch official HL7 Inferno US Core v6.1.0 / ONC (g)(10) test kit on http://localhost:4567
    cmds:
      - docker compose -f deploy/inferno/docker-compose.yml up -d
      - echo "🔥 HL7 Inferno US Core v6.1.0 Test Kit running at http://localhost:4567"
      - echo "   Target FHIR Endpoint → http://host.docker.internal:8080/fhir/r4/demo"

  bench-store:
    desc: Run load test against Postgres operational store directly
    deps: [build]
    cmds:
      - ./bin/loadtest -target=store -duration=30s -workers=40 -bundle-size=5

  bench-http:
    desc: Run load test against Flint FHIR HTTP server
    deps: [build]
    cmds:
      - ./bin/loadtest -target=http -url=http://localhost:8082/fhir/r4/loadtest -duration=30s -workers=50 -bundle-size=5

  test-recovery:
    desc: Run AutoMQ Table Topic restart recovery E2E test
    cmds:
      - go run ./cmd/e2e recovery

  run:
    desc: Run flintd locally (connect to k3d Postgres)
    deps: [build]
    cmds:
      - FLINT_POSTGRES_DSN="{{.PG_DSN}}" bin/flintd

  run-worker:
    desc: Run Temporal worker locally (connect to k3d services)
    deps: [build]
    cmds:
      - FLINT_POSTGRES_DSN="{{.PG_DSN}}" TEMPORAL_ADDRESS=localhost:7233 AUTOMQ_BROKERS=localhost:9092 bin/worker

  down:
    desc: Tear down k3d cluster
    cmds:
      - k3d cluster delete {{.CLUSTER_NAME}}

  status:
    desc: Show pods in flint namespace
    cmds:
      - kubectl get pods -n {{.NAMESPACE}} -o wide

  logs:
    desc: "Tail logs for a specific pod (usage: task logs -- postgres)"
    cmds:
      - kubectl logs -f -n {{.NAMESPACE}} -l app={{.CLI_ARGS}} --tail=50

  psql:
    desc: Open psql shell to Flint Postgres
    cmds:
      - kubectl exec -it -n {{.NAMESPACE}} postgres-0 -- psql -U flint

  migrate:
    desc: Run schema migrations against Postgres
    cmds:
      - psql "{{.PG_DSN}}" -f store/postgres/migrations/001_core_schema.sql
      - psql "{{.PG_DSN}}" -f store/postgres/migrations/002_resource_history.sql
      - psql "{{.PG_DSN}}" -f store/postgres/migrations/003_audit_event.sql
      - psql "{{.PG_DSN}}" -f store/postgres/migrations/004_oauth_and_export_jobs.sql
