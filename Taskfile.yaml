# Flint Development Taskfile
# Usage: task dev      — create k3d cluster + deploy all services
#        task test     — run all tests (needs Postgres)
#        task down     — tear down k3d cluster
#        task status   — show running pods

version: '3'

vars:
  CLUSTER_NAME: flint-dev
  NAMESPACE: flint
  PG_DSN: "postgres://flint:flint@localhost:5432/flint?sslmode=disable"

tasks:
  dev:
    desc: Create k3d cluster and deploy Postgres
    cmds:
      - task: cluster-create
      - task: deploy-postgres
      - echo "✅ Flint dev environment ready"
      - echo "  Postgres      → localhost:5432"

  cluster-create:
    desc: Create k3d cluster (idempotent)
    cmds:
      - k3d cluster list | grep -q {{.CLUSTER_NAME}} || k3d cluster create --config deploy/k3d/cluster.yaml
    status:
      - k3d cluster list | grep -q {{.CLUSTER_NAME}}

  deploy-postgres:
    desc: Deploy Postgres with schema migration
    cmds:
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create configmap postgres-init -n {{.NAMESPACE}}
          --from-file=001_core_schema.sql=store/postgres/migrations/001_core_schema.sql
          --from-file=002_resource_history.sql=store/postgres/migrations/002_resource_history.sql
          --from-file=003_audit_event.sql=store/postgres/migrations/003_audit_event.sql
          --from-file=004_oauth_and_export_jobs.sql=store/postgres/migrations/004_oauth_and_export_jobs.sql
          --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f deploy/k8s/postgres.yaml
      - echo "Waiting for Postgres..."
      - kubectl wait --for=condition=ready pod -l app=postgres -n {{.NAMESPACE}} --timeout=120s

  test:
    desc: Run all Go tests (Postgres integration tests need FLINT_TEST_POSTGRES_DSN)
    cmds:
      - FLINT_TEST_POSTGRES_DSN="{{.PG_DSN}}" go test -race ./... -v -count=1

  test-unit:
    desc: Run unit tests only (no Postgres needed)
    cmds:
      - go test -short ./... -v -count=1

  build:
    desc: Build flintd server, seed, certify, and loadtest binaries
    cmds:
      - go build -o bin/flintd ./cmd/flintd/
      - go build -o bin/seed ./cmd/seed/
      - go build -o bin/certify ./cmd/certify/
      - go build -o bin/loadtest ./cmd/loadtest/

  seed:
    desc: Seed a realistic 29-resource US Core v6.1.0 & v7.0.0 longitudinal clinical cohort into Flint (tenant=demo)
    cmds:
      - go run ./cmd/seed {{.CLI_ARGS}}

  certify:
    desc: Run automated 50-check FHIR R4, US Core v6.1.0 & v7.0.0, and ONC (g)(10) conformance certification suite
    cmds:
      - go run ./cmd/certify {{.CLI_ARGS}}

  docker-build:
    desc: Build multi-stage production container image (flintd, seed, certify)
    cmds:
      - docker build -t flint-fhir/flint:latest .

  deploy-flintd:
    desc: Import flint-fhir/flint:latest into k3d, deploy flintd (NodePort 30080 -> localhost:8080), and seed demo cohort
    cmds:
      - k3d image import flint-fhir/flint:latest -c {{.CLUSTER_NAME}}
      - kubectl delete job flint-seed -n {{.NAMESPACE}} --ignore-not-found
      - kubectl apply -f deploy/k8s/flintd.yaml
      - kubectl rollout status deployment/flintd -n {{.NAMESPACE}} --timeout=120s
      - kubectl wait --for=condition=complete job/flint-seed -n {{.NAMESPACE}} --timeout=120s

  k3d-up:
    desc: 1-command full-stack k3d deployment (cluster + Postgres + docker build + flintd + seeded US Core demo cohort on localhost:8080)
    cmds:
      - task: dev
      - task: docker-build
      - task: deploy-flintd
      - echo "🔥 Flint FHIR R4 k3d Cluster Ready!"
      - echo "  Interactive SMART v2 Sandbox ($docs) → http://localhost:8080/fhir/r4/demo/$docs"
      - echo "  50-Check Conformance ($certify)      → http://localhost:8080/fhir/r4/demo/$certify"
      - echo "  Patient IPS Summary ($summary)       → http://localhost:8080/fhir/r4/demo/Patient/example-patient-1/$summary"
      - echo "  US Core Clinical Notes ($docref)     → http://localhost:8080/fhir/r4/demo/DocumentReference/$docref?patient=example-patient-1"

  certify-inferno:
    desc: Launch official HL7 Inferno US Core v6.1.0 / ONC (g)(10) test kit on http://localhost:4567
    cmds:
      - docker compose -f deploy/inferno/docker-compose.yml up -d
      - echo "🔥 HL7 Inferno US Core v6.1.0 Test Kit running at http://localhost:4567"
      - echo "   Target FHIR Endpoint → http://host.docker.internal:8080/fhir/r4/demo"

  bench-store:
    desc: Run load test against Postgres operational store directly
    deps: [build]
    cmds:
      - ./bin/loadtest -target=store -duration=30s -workers=40 -bundle-size=5

  bench-http:
    desc: Run load test against Flint FHIR HTTP server
    deps: [build]
    cmds:
      - ./bin/loadtest -target=http -url=http://localhost:8082/fhir/r4/loadtest -duration=30s -workers=50 -bundle-size=5

  run:
    desc: Run flintd locally (connect to k3d Postgres)
    deps: [build]
    cmds:
      - FLINT_POSTGRES_DSN="{{.PG_DSN}}" bin/flintd

  down:
    desc: Tear down k3d cluster
    cmds:
      - k3d cluster delete {{.CLUSTER_NAME}}

  status:
    desc: Show pods in flint namespace
    cmds:
      - kubectl get pods -n {{.NAMESPACE}} -o wide

  logs:
    desc: "Tail logs for a specific pod (usage: task logs -- postgres)"
    cmds:
      - kubectl logs -f -n {{.NAMESPACE}} -l app={{.CLI_ARGS}} --tail=50

  psql:
    desc: Open psql shell to Flint Postgres
    cmds:
      - kubectl exec -it -n {{.NAMESPACE}} postgres-0 -- psql -U flint

  migrate:
    desc: Run schema migrations against Postgres
    cmds:
      - psql "{{.PG_DSN}}" -f store/postgres/migrations/001_core_schema.sql
      - psql "{{.PG_DSN}}" -f store/postgres/migrations/002_resource_history.sql
      - psql "{{.PG_DSN}}" -f store/postgres/migrations/003_audit_event.sql
      - psql "{{.PG_DSN}}" -f store/postgres/migrations/004_oauth_and_export_jobs.sql

  # ─── Optional Add-Ons (Streaming CDC, Temporal Ingestion Worker, Clinical Lakehouse) ───

  addons-up:
    desc: "[Add-On] Deploy optional Temporal, Garage S3, Iceberg REST catalog, and AutoMQ CDC services into k3d"
    cmds:
      - task: cluster-create
      - task: deploy-postgres
      - task: deploy-temporal
      - task: deploy-garage
      - task: deploy-iceberg
      - task: deploy-automq
      - echo "✅ Flint optional add-on services ready"
      - echo "  Temporal UI   → http://localhost:8088"
      - echo "  AutoMQ Kafka  → localhost:9092"
      - echo "  Garage S3     → http://localhost:9000 (API) / http://localhost:9001 (Web)"
      - echo "  Iceberg REST  → http://localhost:8181"

  build-worker:
    desc: "[Add-On] Build Temporal ingestion worker binary (bin/worker)"
    cmds:
      - go build -o bin/worker ./cmd/worker/

  run-worker:
    desc: "[Add-On] Run Temporal ingestion worker locally"
    deps: [build-worker]
    cmds:
      - FLINT_POSTGRES_DSN="{{.PG_DSN}}" bin/worker

  deploy-worker:
    desc: "[Add-On] Deploy Temporal ingestion worker (flint-worker) to k3d"
    cmds:
      - kubectl apply -f deploy/k8s/worker.yaml
      - kubectl rollout status deployment/flint-worker -n {{.NAMESPACE}} --timeout=120s

  deploy-temporal:
    desc: "[Add-On] Deploy Temporal server + UI"
    cmds:
      - kubectl apply -f deploy/k8s/temporal.yaml
      - echo "Waiting for Temporal..."
      - kubectl wait --for=condition=ready pod -l app=temporal -n {{.NAMESPACE}} --timeout=180s

  deploy-garage:
    desc: "[Add-On] Deploy Garage S3-compatible object storage"
    cmds:
      - kubectl apply -f deploy/k8s/garage.yaml
      - echo "Waiting for Garage..."
      - kubectl wait --for=condition=ready pod -l app=garage -n {{.NAMESPACE}} --timeout=120s
      - echo "Initializing Garage layout and bucket..."
      - kubectl delete job garage-init -n {{.NAMESPACE}} --ignore-not-found
      - kubectl apply -f deploy/k8s/garage.yaml
      - kubectl wait --for=condition=complete job/garage-init -n {{.NAMESPACE}} --timeout=120s

  deploy-iceberg:
    desc: "[Add-On] Deploy Iceberg REST catalog (backed by Garage S3)"
    cmds:
      - kubectl apply -f deploy/k8s/iceberg-rest.yaml
      - echo "Waiting for Iceberg REST catalog..."
      - kubectl wait --for=condition=ready pod -l app=iceberg-rest -n {{.NAMESPACE}} --timeout=120s

  deploy-automq:
    desc: "[Add-On] Deploy AutoMQ (Kafka on S3 + Table Topic -> Iceberg)"
    cmds:
      - kubectl apply -f deploy/k8s/automq.yaml
      - echo "Waiting for AutoMQ..."
      - kubectl wait --for=condition=ready pod -l app=automq -n {{.NAMESPACE}} --timeout=180s

  test-analytics:
    desc: "[Add-On] Run SQLMesh healthcare dimensional lakehouse unit tests (DuckDB)"
    cmds:
      - cd analytics && uv run sqlmesh test

  test-recovery:
    desc: "[Add-On] Verify AutoMQ Table Topic restart recovery (zero data loss)"
    cmds:
      - go run ./cmd/e2e/recovery.go

  bench-temporal:
    desc: "[Add-On] Run load test via Temporal workflow orchestration"
    deps: [build]
    cmds:
      - ./bin/loadtest -target=temporal -duration=30s -workers=30 -bundle-size=5

