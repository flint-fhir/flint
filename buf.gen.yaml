version: v2

plugins:
  - local: protoc-gen-proto2type
    out: gen/go/store/postgres
    opt:
      - lang=go
      - backend=postgres
      - postgres_mode=search_index
      - postgres_search_params=fhir/r4/search-parameters.json
      - go_package=github.com/flint-fhir/flint/gen/go/store/postgres;postgres
      - domain=false

inputs:
  - directory: .
    paths:
      - proto/google/fhir/proto/r4/core/resources/patient.proto
      - proto/google/fhir/proto/r4/core/resources/encounter.proto
      - proto/google/fhir/proto/r4/core/resources/observation.proto
      - proto/google/fhir/proto/r4/core/resources/condition.proto
      - proto/google/fhir/proto/r4/core/resources/practitioner.proto
      - proto/google/fhir/proto/r4/core/resources/medication_request.proto
      - proto/google/fhir/proto/r4/core/resources/allergy_intolerance.proto
      - proto/google/fhir/proto/r4/core/resources/procedure.proto
      - proto/google/fhir/proto/r4/core/resources/diagnostic_report.proto
      - proto/google/fhir/proto/r4/core/resources/immunization.proto
      - proto/google/fhir/proto/r4/core/resources/organization.proto
      - proto/google/fhir/proto/r4/core/resources/specimen.proto
      - proto/google/fhir/proto/r4/core/resources/location.proto
