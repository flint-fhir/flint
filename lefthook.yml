# Lefthook configuration for Flint
# Refer for explanation to following link:
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -l -w {staged_files}
    go-vet:
      glob: "*.go"
      run: go vet ./...
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run
    buf-lint:
      glob: "*.proto"
      run: buf lint

pre-push:
  commands:
    go-test:
      run: go test -short ./...
