version: v2

plugins:
  - local: protoc-gen-proto2type
    out: gen/go/searchidx
    opt:
      - lang=go
      - backend=postgres
      - postgres_mode=search_index
      - postgres_search_params=fhir/r4/search-parameters.json
      - go_package=github.com/flint-fhir/flint/gen/go/searchidx;searchidx
      - domain=false

inputs:
  - directory: .
    paths:
      - proto/google/fhir/proto/r4/core/resources/patient.proto
