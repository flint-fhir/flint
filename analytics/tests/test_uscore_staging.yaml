test_stg_medication_request_cdc:
  model: flint_stg.stg_medication_request
  inputs:
    fhir_raw.medication_request:
      rows:
        - tenant_id: "tenant-a"
          _kafka_key: "tenant-a/medreq-100"
          _kafka_offset: 1
          _kafka_timestamp: "2026-10-05 10:00:00+00:00"
          op: "I"
          _kafka_value: '{"status":{"value":"active"},"intent":{"value":"order"},"subject":{"reference":{"value":"Patient/pat-001"}},"medicationCodeableConcept":{"coding":[{"system":{"value":"http://www.nlm.nih.gov/research/umls/rxnorm"},"code":{"value":"1049502"}}]},"authoredOn":{"value":"2026-10-05T10:00:00Z"}}'
  outputs:
    query:
      rows:
        - tenant_id: "tenant-a"
          medication_request_id: "medreq-100"
          patient_id: "pat-001"
          status: "active"
          intent: "order"
          medication_system: "http://www.nlm.nih.gov/research/umls/rxnorm"
          medication_code: "1049502"
          authored_on: "2026-10-05 10:00:00+00:00"
          updated_at: "2026-10-05 10:00:00+00:00"

