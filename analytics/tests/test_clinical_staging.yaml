          _kafka_key: "enc-100"
          _kafka_offset: 1
          _kafka_timestamp: "2026-10-01 08:00:00+00:00"
          op: "I"
          _kafka_value: '{"status":{"value":"in-progress"},"class":{"code":{"value":"IMP"}},"subject":{"reference":{"value":"Patient/pat-001"}},"period":{"start":{"value":"2026-10-01T08:00:00Z"}}}'
        - tenant_id: "tenant-a"
          _kafka_key: "enc-100"
          _kafka_offset: 2
          _kafka_timestamp: "2026-10-02 14:00:00+00:00"
          op: "U"
          _kafka_value: '{"status":{"value":"finished"},"class":{"code":{"value":"IMP"}},"subject":{"reference":{"value":"Patient/pat-001"}},"period":{"start":{"value":"2026-10-01T08:00:00Z"},"end":{"value":"2026-10-02T14:00:00Z"}}}'
  outputs:
    query:
      rows:
        - tenant_id: "tenant-a"
          encounter_id: "enc-100"
          patient_id: "pat-001"
          status: "finished"
          class_code: "IMP"
          period_start: "2026-10-01 08:00:00+00:00"
          period_end: "2026-10-02 14:00:00+00:00"
          updated_at: "2026-10-02 14:00:00+00:00"

test_stg_condition_cdc_and_tombstone:
  model: flint_stg.stg_condition
  inputs:
    fhir_raw.condition:
      rows:
        - tenant_id: "tenant-a"
          _kafka_key: "cond-100"
          _kafka_offset: 1
          _kafka_timestamp: "2026-10-01 10:00:00+00:00"
          op: "I"
          _kafka_value: '{"subject":{"reference":{"value":"Patient/pat-001"}},"code":{"coding":[{"system":{"value":"http://snomed.info/sct"},"code":{"value":"44054006"}}]},"clinicalStatus":{"coding":[{"code":{"value":"active"}}]},"verificationStatus":{"coding":[{"code":{"value":"confirmed"}}]},"onsetDateTime":{"value":"2025-01-01"}}'
        - tenant_id: "tenant-a"
          _kafka_key: "cond-deleted"
          _kafka_offset: 1
          _kafka_timestamp: "2026-10-01 10:00:00+00:00"
          op: "I"
          _kafka_value: '{"subject":{"reference":"Patient/pat-001"}}'
        - tenant_id: "tenant-a"
          _kafka_key: "cond-deleted"
          _kafka_offset: 2
          _kafka_timestamp: "2026-10-01 11:00:00+00:00"
          op: "D"
          _kafka_value: "[tombstone]"
  outputs:
    query:
      rows:
        - tenant_id: "tenant-a"
          condition_id: "cond-100"
          patient_id: "pat-001"
          code_system: "http://snomed.info/sct"
          code: "44054006"
          clinical_status: "active"
          verification_status: "confirmed"
          onset_date: "2025-01-01"
          updated_at: "2026-10-01 10:00:00+00:00"

