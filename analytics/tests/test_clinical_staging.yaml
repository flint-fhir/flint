test_fct_encounter_los_and_reference_normalization:
  model: flint_marts.fct_encounter
  inputs:
    flint_stg.stg_encounter:
      rows:
        - tenant_id: "tenant-a"
          encounter_id: "enc-100"
          patient_id: "pat-001"
          status: "finished"
          class_code: "IMP"
          period_start: "2026-10-01 08:00:00+00:00"
          period_end: "2026-10-02 14:00:00+00:00"
          updated_at: "2026-10-02 14:00:00+00:00"
  outputs:
    query:
      rows:
        - tenant_id: "tenant-a"
          encounter_id: "enc-100"
          patient_id: "pat-001"
          status: "finished"
          class_code: "IMP"
          period_start: "2026-10-01 08:00:00+00:00"
          period_end: "2026-10-02 14:00:00+00:00"
          los_hours: 30
          updated_at: "2026-10-02 14:00:00+00:00"

test_stg_observation_cdc_and_quantity:
  model: flint_stg.stg_observation
  inputs:
    fhir_raw.observation:
      rows:
        - tenant_id: "tenant-a"
          _kafka_key: "obs-100"
          _kafka_offset: 1
          _kafka_timestamp: "2026-10-05 09:00:00+00:00"
          op: "I"
          _kafka_value: '{"status":{"value":"preliminary"},"subject":{"reference":{"value":"Patient/pat-001"}},"code":{"coding":[{"system":{"value":"http://loinc.org"},"code":{"value":"8867-4"}}]},"valueQuantity":{"value":{"value":"68.5"},"unit":{"value":"/min"}},"effectiveDateTime":{"value":"2026-10-05T09:00:00Z"}}'
        - tenant_id: "tenant-a"
          _kafka_key: "obs-100"
          _kafka_offset: 2
          _kafka_timestamp: "2026-10-05 09:30:00+00:00"
          op: "U"
          _kafka_value: '{"status":{"value":"final"},"subject":{"reference":{"value":"Patient/pat-001"}},"code":{"coding":[{"system":{"value":"http://loinc.org"},"code":{"value":"8867-4"}}]},"valueQuantity":{"value":{"value":"72.0"},"unit":{"value":"/min"}},"effectiveDateTime":{"value":"2026-10-05T09:30:00Z"}}'
  outputs:
    query:
      rows:
        - tenant_id: "tenant-a"
          observation_id: "obs-100"
          patient_id: "pat-001"
          status: "final"
          code_system: "http://loinc.org"
          code: "8867-4"
          value_quantity: 72.0
          value_unit: "/min"
          effective_datetime: "2026-10-05 09:30:00+00:00"
          updated_at: "2026-10-05 09:30:00+00:00"

