services:
  inferno:
    image: infernocommunity/inferno-core-us-core:latest
    ports:
      - "4567:4567"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RACK_ENV=production
      - BASE_PATH=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - validator_service

  worker:
    image: infernocommunity/inferno-core-us-core:latest
    command: bundle exec sidekiq -r ./lib/us_core_test_kit.rb
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RACK_ENV=production
      - VALIDATOR_BASE_URL=http://validator_service:3500
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - validator_service

  validator_service:
    image: infernocommunity/fhir-validator-service:latest
    environment:
      - SESSION_CACHE_DURATION=-1
    ports:
      - "3500:3500"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
