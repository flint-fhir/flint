# k3d cluster config for Flint local dev
# Usage: k3d cluster create --config deploy/k3d/cluster.yaml
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: flint-dev
servers: 1
agents: 0
ports:
  # Core: Postgres (via NodePort)
  - port: 5432:30432
    nodeFilters:
      - loadbalancer
  # Core: Flint FHIR API (via NodePort)
  - port: 8080:30080
    nodeFilters:
      - loadbalancer
  # Optional Add-On: Temporal UI (via NodePort)
  - port: 8088:30088
    nodeFilters:
      - loadbalancer
  # Optional Add-On: AutoMQ Kafka (via NodePort)
  - port: 9092:30092
    nodeFilters:
      - loadbalancer
  # Optional Add-On: Garage S3 API & Web UI (via NodePort)
  - port: 9000:30900
    nodeFilters:
      - loadbalancer
  - port: 9001:30901
    nodeFilters:
      - loadbalancer
  # Optional Add-On: Iceberg REST Catalog (via NodePort)
  - port: 8181:30181
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
