# Flint Dev - Iceberg REST Catalog
# Uses the official Apache Iceberg REST catalog reference implementation.
# AutoMQ's Table Topic connects here to register tables.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: flint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iceberg-rest
  template:
    metadata:
      labels:
        app: iceberg-rest
    spec:
      containers:
        - name: iceberg-rest
          image: tabulario/iceberg-rest:latest
          ports:
            - containerPort: 8181
          env:
            - name: CATALOG_WAREHOUSE
              value: s3://warehouse/
            - name: CATALOG_IO__IMPL
              value: org.apache.iceberg.aws.s3.S3FileIO
            - name: CATALOG_S3_ENDPOINT
              value: http://minio:9000
            - name: CATALOG_S3_PATH__STYLE__ACCESS
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              value: flintadmin
            - name: AWS_SECRET_ACCESS_KEY
              value: flintadmin123
            - name: AWS_REGION
              value: us-east-1
          readinessProbe:
            httpGet:
              path: /v1/config
              port: 8181
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: flint
spec:
  type: NodePort
  selector:
    app: iceberg-rest
  ports:
    - port: 8181
      targetPort: 8181
      nodePort: 30181
