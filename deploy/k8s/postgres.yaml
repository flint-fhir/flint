# Flint Dev - Postgres
---
apiVersion: v1
kind: Namespace
metadata:
  name: flint
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: flint
data:
  001_core_schema.sql: |
    -- Auto-loaded from store/postgres/migrations/001_core_schema.sql
    -- This is a placeholder; the Taskfile copies the real migration in.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: flint
type: Opaque
stringData:
  POSTGRES_USER: flint
  POSTGRES_PASSWORD: flint
  POSTGRES_DB: flint
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: flint
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "flint"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flint
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
