# Flint Dev - AutoMQ (Kafka-compatible)
# Uses standard Apache Kafka image for local dev. In production, use AutoMQ.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automq
  namespace: flint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: automq
  template:
    metadata:
      labels:
        app: automq
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://automq:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
            - name: CLUSTER_ID
              value: "flint-dev-cluster-001"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: automq
  namespace: flint
spec:
  type: NodePort
  selector:
    app: automq
  ports:
    - port: 9092
      targetPort: 9092
      nodePort: 30092
---
# Topic initialization job — creates topics for Big 5 resource types
apiVersion: batch/v1
kind: Job
metadata:
  name: create-topics
  namespace: flint
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z automq 9092; do echo waiting for kafka; sleep 2; done']
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command:
            - /bin/bash
            - -c
            - |
              for topic in fhir.Patient fhir.Encounter fhir.Observation fhir.Condition fhir.MedicationRequest; do
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server automq:9092 \
                  --create \
                  --if-not-exists \
                  --topic "$topic" \
                  --partitions 6 \
                  --replication-factor 1 \
                  --config cleanup.policy=compact \
                  --config min.compaction.lag.ms=3600000
                echo "Created topic: $topic"
              done
