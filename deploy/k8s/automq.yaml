# Flint Dev - AutoMQ (native Kafka with S3 storage + Table Topic → Iceberg)
# Uses the real AutoMQ image with MinIO for S3 and built-in Table Topic for Iceberg sinking.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: automq-config
  namespace: flint
data:
  server.properties: |
    # AutoMQ Core - S3 shared storage via Garage
    s3.data.buckets=0@s3://automq-data?region=us-east-1&endpoint=http://garage:3900&pathStyle=true
    s3.ops.buckets=0@s3://automq-ops?region=us-east-1&endpoint=http://garage:3900&pathStyle=true

    # Broker settings
    node.id=1
    process.roles=broker,controller
    listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://automq:9092
    controller.listener.names=CONTROLLER
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    controller.quorum.voters=1@localhost:9093

    # Table Topic → Iceberg catalog
    automq.table.topic.catalog.type=rest
    automq.table.topic.catalog.uri=http://iceberg-rest:8181
    automq.table.topic.catalog.warehouse=s3://warehouse/
    automq.table.topic.catalog.s3.endpoint=http://garage:3900
    automq.table.topic.catalog.s3.access-key-id=GK1e8391735937d6afcd2dd84c
    automq.table.topic.catalog.s3.secret-access-key=e9249c7fd2bbce0600a196bc6bc97f069b8948f20bf54fcaaefa924256b01e6c
    automq.table.topic.catalog.s3.path-style-access=true

    # Log config
    num.partitions=6
    log.retention.hours=168
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automq
  namespace: flint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: automq
  template:
    metadata:
      labels:
        app: automq
    spec:
      containers:
        - name: automq
          image: automqinc/automq:latest
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_S3_ACCESS_KEY
              value: GK1e8391735937d6afcd2dd84c
            - name: KAFKA_S3_SECRET_KEY
              value: e9249c7fd2bbce0600a196bc6bc97f069b8948f20bf54fcaaefa924256b01e6c
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx2g -XX:MetaspaceSize=96m -XX:MaxDirectMemorySize=512M"
            - name: CLUSTER_ID
              value: "flint-dev-automq-001"
          volumeMounts:
            - name: config
              mountPath: /opt/automq/config/server.properties
              subPath: server.properties
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: automq-config
---
apiVersion: v1
kind: Service
metadata:
  name: automq
  namespace: flint
spec:
  type: NodePort
  selector:
    app: automq
  ports:
    - port: 9092
      targetPort: 9092
      nodePort: 30092
---
# Topic initialization job — creates Table Topics for Big 5 resource types
# Table Topics auto-sink to Iceberg via AutoMQ's built-in Table Worker
apiVersion: batch/v1
kind: Job
metadata:
  name: create-table-topics
  namespace: flint
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-automq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z automq 9092; do echo waiting for automq; sleep 5; done']
      containers:
        - name: create-topics
          image: automqinc/automq:latest
          command:
            - /bin/bash
            - -c
            - |
              for topic in fhir.Patient fhir.Encounter fhir.Observation fhir.Condition fhir.MedicationRequest; do
                /opt/automq/bin/kafka-topics.sh \
                  --bootstrap-server automq:9092 \
                  --create \
                  --if-not-exists \
                  --topic "$topic" \
                  --partitions 6 \
                  --replication-factor 1 \
                  --config cleanup.policy=compact \
                  --config automq.table.topic.enable=true \
                  --config automq.table.topic.iceberg.upsert.mode=equality_delete \
                  --config automq.table.topic.iceberg.upsert.key=res_id
                echo "Created Table Topic: $topic"
              done
