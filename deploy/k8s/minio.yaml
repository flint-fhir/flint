# Flint Dev - MinIO (S3-compatible storage for Iceberg)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: flint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: flintadmin
            - name: MINIO_ROOT_PASSWORD
              value: flintadmin123
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: flint
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
# Create the Iceberg warehouse bucket on startup
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: flint
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z minio 9000; do sleep 2; done']
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              mc alias set flint http://minio:9000 flintadmin flintadmin123
              mc mb --ignore-existing flint/warehouse
              mc mb --ignore-existing flint/iceberg-data
              echo "MinIO buckets created"
