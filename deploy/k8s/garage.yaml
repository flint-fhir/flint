# Flint Dev - Garage (S3-compatible object storage for Iceberg + AutoMQ)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: flint
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

    [s3_api]
    s3_region = "us-east-1"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.localhost"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "flintadmintoken"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: flint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v1.1.0
          imagePullPolicy: IfNotPresent
          command: ["/garage", "server"]
          ports:
            - containerPort: 3900
              name: s3
            - containerPort: 3901
              name: rpc
            - containerPort: 3903
              name: admin
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
          volumeMounts:
            - name: config
              mountPath: /etc/garage
            - name: data
              mountPath: /var/lib/garage
          readinessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: flint
spec:
  type: NodePort
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
      nodePort: 30900
    - name: admin
      port: 3903
      targetPort: 3903
      nodePort: 30903
