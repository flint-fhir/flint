---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
  namespace: flint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apicurio
  template:
    metadata:
      labels:
        app: apicurio
    spec:
      containers:
        - name: apicurio
          image: apicurio/apicurio-registry:latest-release
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Enable CORS for local dev
            - name: APICURIO_REST_MUTABILITY_ARTIFACT__VERSION_CONTENT_ENABLED
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio
  namespace: flint
spec:
  selector:
    app: apicurio
  ports:
    - port: 8080
      targetPort: 8080
