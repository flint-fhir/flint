# Flint FHIR R4 Server & Temporal Worker — Kubernetes Deployment & Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flintd
  namespace: flint
  labels:
    app: flintd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flintd
  template:
    metadata:
      labels:
        app: flintd
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: flintd
          image: flint-fhir/flint:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/flintd"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FLINT_ADDR
              value: ":8080"
            - name: FLINT_POSTGRES_DSN
              value: "postgres://flint:flint@postgres.flint.svc.cluster.local:5432/flint?sslmode=disable"
            - name: FLINT_AUTOMQ_BROKERS
              value: "automq.flint.svc.cluster.local:9092"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flintd
  namespace: flint
  labels:
    app: flintd
spec:
  type: NodePort
  selector:
    app: flintd
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flint-worker
  namespace: flint
  labels:
    app: flint-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flint-worker
  template:
    metadata:
      labels:
        app: flint-worker
    spec:
      containers:
        - name: worker
          image: flint-fhir/flint:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/worker"]
          env:
            - name: FLINT_POSTGRES_DSN
              value: "postgres://flint:flint@postgres.flint.svc.cluster.local:5432/flint?sslmode=disable"
            - name: TEMPORAL_ADDRESS
              value: "temporal.flint.svc.cluster.local:7233"
            - name: AUTOMQ_BROKERS
              value: "automq.flint.svc.cluster.local:9092"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-seed
  namespace: flint
  labels:
    app: flint-seed
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: flint-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: flint-fhir/flint:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/seed", "-url", "http://flintd.flint.svc.cluster.local:8080", "-tenant", "demo"]

