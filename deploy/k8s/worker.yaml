# Optional Add-On: Flint Temporal Ingestion Worker Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flint-worker
  namespace: flint
  labels:
    app: flint-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flint-worker
  template:
    metadata:
      labels:
        app: flint-worker
    spec:
      containers:
        - name: worker
          image: flint-fhir/flint:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/worker"]
          env:
            - name: FLINT_POSTGRES_DSN
              value: "postgres://flint:flint@postgres.flint.svc.cluster.local:5432/flint?sslmode=disable"
            - name: FLINT_AUTOMQ_BROKERS
              value: "automq.flint.svc.cluster.local:9092"
            - name: TEMPORAL_ADDRESS
              value: "temporal.flint.svc.cluster.local:7233"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
