{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flint.fullname" . }}-worker
  labels:
    {{- include "flint.baseLabels" . | nindent 4 }}
    {{- include "flint.workerSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "flint.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flint.workerSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "flint.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: TEMPORAL_HOST_PORT
              value: {{ .Values.worker.temporalHostPort | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.worker.temporalNamespace | quote }}
            - name: FLINT_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "flint.secretName" . }}
                  key: {{ .Values.existingSecretKeys.postgresDSN }}
                  optional: {{ ne .Values.store.backend "postgres" }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
