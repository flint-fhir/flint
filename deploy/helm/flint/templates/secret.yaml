{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flint.fullname" . }}
  labels:
    {{- include "flint.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretKeys.postgresDSN }}: {{ .Values.store.postgresDSN | quote }}
  {{ .Values.existingSecretKeys.dorisDSN }}: {{ .Values.store.dorisDSN | quote }}
  {{ .Values.existingSecretKeys.signingKeyPEM }}: {{ .Values.auth.signingKeyPEM | quote }}
  {{ .Values.existingSecretKeys.shcSigningKeyPEM }}: {{ .Values.auth.shcSigningKeyPEM | quote }}
  {{ .Values.existingSecretKeys.otlpHeaders }}: {{ .Values.telemetry.headers | quote }}
{{- end }}
