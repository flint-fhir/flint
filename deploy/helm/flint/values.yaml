replicaCount: 2

image:
  repository: ghcr.io/flint-fhir/flint
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fhir.example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

store:
  backend: postgres
  analyticsBackend: none
  tenantIsolation: schema
  referentialIntegrity: lenient
  postgresDSN: "postgres://flint:flint@postgres:5432/flint?sslmode=disable"
  dorisDSN: ""
  dorisDatabase: "flint"
  dorisGroupCommit: "async_mode"
  sqliteDSN: "/var/lib/flint/flint.db"

auth:
  enforceDevAuth: false
  requireClientJWK: false
  oidcIssuer: ""
  oidcAudience: ""
  provider: ""
  signingKeyPEM: ""
  shcSigningKeyPEM: ""

terminology:
  serverURL: ""
  timeout: "5s"
  cacheTTL: "15m"
  failOpen: true

telemetry:
  enabled: false
  endpoint: "http://otel-collector:4318"
  protocol: "http/protobuf"
  serviceName: ""
  sampleRatio: "1.0"
  headers: ""

existingSecret: ""
existingSecretKeys:
  postgresDSN: postgres-dsn
  dorisDSN: doris-dsn
  signingKeyPEM: signing-key-pem
  shcSigningKeyPEM: shc-signing-key-pem
  otlpHeaders: otlp-headers

extraEnv: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

topologySpreadConstraints: []

nodeSelector: {}
tolerations: []
affinity: {}

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

worker:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/flint-fhir/flint-worker
    pullPolicy: IfNotPresent
    tag: ""
  temporalHostPort: "temporal:7233"
  temporalNamespace: "default"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

seedJob:
  enabled: false
  tenant: "default"
  suite: "uscore"
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
