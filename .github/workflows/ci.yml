name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flint
          POSTGRES_USER: flint
          POSTGRES_PASSWORD: flint
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test
        env:
          FLINT_TEST_POSTGRES_DSN: "postgres://flint:flint@localhost:5432/flint?sslmode=disable"
        run: go test -v -race ./...

      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: gofmt check
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: SQL schema & Atlas migration integrity
        run: go test -v ./store/postgres -run TestSchema_NoJSONBAndAtlasSumSync

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - name: buf lint
        run: buf lint

  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: SQLMesh Lakehouse Unit Tests (DuckDB)
        run: uv run --project analytics sqlmesh --paths analytics test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch (linux/amd64, linux/arm64) production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: flint
          platforms: linux/amd64,linux/arm64
          push: false
          tags: flint-fhir/flint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

