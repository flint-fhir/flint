name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flint
          POSTGRES_USER: flint
          POSTGRES_PASSWORD: flint
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test & Coverage Gate (>= 75% per package)
        env:
          FLINT_TEST_POSTGRES_DSN: "postgres://flint:flint@localhost:5432/flint?sslmode=disable"
        run: |
          go test -v -race -cover ./... | tee test-coverage.log
          awk '
            /^ok[[:space:]]+github\.com\/flint-fhir\/flint\// && $2 !~ /\/gen\// {
              pkg = $2
              for (i = 1; i <= NF; i++) {
                if ($i == "coverage:") {
                  pct = $(i+1)
                  sub(/%/, "", pct)
                  printf "Package %-48s %6.1f%%\n", pkg, pct + 0
                  if (pct + 0 < 75.0) {
                    printf "::error::Package %s coverage %.1f%% is below the 75.0%% threshold\n", pkg, pct + 0
                    failed = 1
                  }
                }
              }
            }
            END {
              if (failed) exit 1
            }
          ' test-coverage.log

      - name: Vet
        run: go vet ./...

      - name: Go Native Fuzzing Gate (Search, _filter, FHIRPath, Patch & Validator)
        run: |
          go test ./store/postgres -run '^$' -fuzz=FuzzParseFilterExpr -fuzztime=2s
          go test ./store/postgres -run '^$' -fuzz=FuzzSearchQueryAndIfNoneExist -fuzztime=2s
          go test ./server -run '^$' -fuzz=FuzzFHIRPathR4Engine -fuzztime=2s
          go test ./server -run '^$' -fuzz=FuzzPatchEngines -fuzztime=2s
          go test ./server -run '^$' -fuzz=FuzzValidationAndDynamicExtraction -fuzztime=2s

      - name: Live Server Binary, US Core Seeder & 78-Check $certify E2E Gate
        env:
          FLINT_POSTGRES_DSN: "postgres://flint:flint@localhost:5432/flint?sslmode=disable"
          FLINT_ADDR: "127.0.0.1:18080"
        run: |
          mkdir -p bin
          go build -o bin/flintd ./cmd/flintd
          go build -o bin/seed ./cmd/seed
          go build -o bin/certify ./cmd/certify
          ./bin/flintd > flintd-ci.log 2>&1 &
          FLINTD_PID=$!
          trap "kill ${FLINTD_PID} 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18080/readyz
          ./bin/seed -url http://127.0.0.1:18080 -tenant demo
          ./bin/certify -url http://127.0.0.1:18080 -tenant demo -out certify-report.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: gofmt check
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: SQL schema & Atlas migration integrity
        run: go test -v ./store/postgres -run TestSchema_NoJSONBAndAtlasSumSync

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - name: buf lint
        run: buf lint

  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: SQLMesh Lakehouse Unit Tests (DuckDB)
        run: uv run --project analytics sqlmesh --paths analytics test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch (linux/amd64, linux/arm64) production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: flint
          platforms: linux/amd64,linux/arm64
          push: false
          tags: flint-fhir/flint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

