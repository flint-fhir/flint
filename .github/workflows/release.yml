name: Release & Container Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/flint-fhir/flint

jobs:
  container:
    name: Publish Multi-Arch GHCR Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch FHIR server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: flint
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-binaries:
    name: Build & Publish GitHub Release Binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build multi-arch release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              pkg="flint_${VERSION}_${goos}_${goarch}"
              mkdir -p "dist/${pkg}"
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
                -o "dist/${pkg}/flintd" ./cmd/flintd
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -ldflags="-s -w" \
                -o "dist/${pkg}/seed" ./cmd/seed
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -ldflags="-s -w" \
                -o "dist/${pkg}/certify" ./cmd/certify
              cp LICENSE README.md "dist/${pkg}/"
              tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
              rm -rf "dist/${pkg}"
            done
          done
          cp install.sh dist/install.sh
          cd dist
          sha256sum *.tar.gz > checksums.txt

          VER_CLEAN="${VERSION#v}"
          SHA_DARWIN_ARM64="$(awk -v f="flint_${VERSION}_darwin_arm64.tar.gz" '$2 == f { print $1 }' checksums.txt)"
          SHA_DARWIN_AMD64="$(awk -v f="flint_${VERSION}_darwin_amd64.tar.gz" '$2 == f { print $1 }' checksums.txt)"
          SHA_LINUX_ARM64="$(awk -v f="flint_${VERSION}_linux_arm64.tar.gz" '$2 == f { print $1 }' checksums.txt)"
          SHA_LINUX_AMD64="$(awk -v f="flint_${VERSION}_linux_amd64.tar.gz" '$2 == f { print $1 }' checksums.txt)"

          cat > flint.rb <<EOF
          class Flint < Formula
            desc "Decoupled HL7 FHIR R4 API & pluggable clinical storage engine"
            homepage "https://github.com/flint-fhir/flint"
            version "${VER_CLEAN}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/flint-fhir/flint/releases/download/${VERSION}/flint_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/flint-fhir/flint/releases/download/${VERSION}/flint_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/flint-fhir/flint/releases/download/${VERSION}/flint_${VERSION}_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/flint-fhir/flint/releases/download/${VERSION}/flint_${VERSION}_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "flintd"
              bin.install "seed" => "flint-seed"
              bin.install "certify" => "flint-certify"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/flintd --version")
            end
          end
          EOF
          sed -i 's/^          //' flint.rb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/flint.rb
            dist/install.sh

      - name: Publish Homebrew Formula to flint-fhir/homebrew-tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/flint-fhir/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cp dist/flint.rb /tmp/homebrew-tap/Formula/flint.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flint.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(formula): flint ${VERSION}"
            git push origin HEAD:main
          fi
