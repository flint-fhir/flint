name: Continuous Fuzzing

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Duration per fuzz target (e.g. 20s, 1m)'
        required: false
        default: '20s'
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./pkg/fhirxml
            target: FuzzXMLRoundTrip
          - pkg: ./pkg/igloader
            target: FuzzLoadTGZBytes
          - pkg: ./store
            target: FuzzParseFilterExpr
          - pkg: ./store
            target: FuzzSearchQueryAndIfNoneExist
          - pkg: ./server
            target: FuzzFHIRPathR4Engine
          - pkg: ./server
            target: FuzzPatchEngines
          - pkg: ./server
            target: FuzzValidationAndDynamicExtraction
          - pkg: ./server
            target: FuzzWebSocketFrames
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Run ${{ matrix.target }}
        env:
          FUZZ_DURATION: ${{ inputs.fuzztime || '20s' }}
        run: |
          go test "${{ matrix.pkg }}" -run '^$' -fuzz='^${{ matrix.target }}$' -fuzztime="${FUZZ_DURATION}"

      - name: Upload crash corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: '**/testdata/fuzz/${{ matrix.target }}/**'
          if-no-files-found: ignore
